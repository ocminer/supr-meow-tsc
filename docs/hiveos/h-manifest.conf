# HiveOS custom miner manifest for supr-meow-tsc.
# Sourced by HiveOS before every h-*.sh script.

CUSTOM_NAME=supr-meow-tsc
CUSTOM_VERSION=0.0.0
CUSTOM_BUILD=1

# Written by h-config.sh from the flight sheet, read by h-run.sh.
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/supr-meow-tsc/miner.conf

# HiveOS rotates this itself; h-run.sh must not redirect anywhere else.
CUSTOM_LOG_BASENAME=/var/log/miner/supr-meow-tsc/supr-meow-tsc
