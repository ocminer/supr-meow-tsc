services:
  miner:
    image: ocminersupr/supr-meow-tsc:0.6.0
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    environment:
      POOL_URL: "stratum+tcp://YOUR_POOL:PORT"
      WALLET: "YOUR_WALLET"
      WORKER: "rig1"
      DEVICES: "0"
      # For a matching pair, select both device_ids above and use:
      # DEVICES: "0,1"
      # SPLIT_MODEL: "1"
    volumes:
      - model-cache:/models
volumes:
  model-cache:
